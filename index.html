                prepTime: `${(i % 3) * 5 + 10} Min`,

        // --- HAUPTKOMPONENTE ---
        function FoodlyApp() {
            // Zustand für Onboarding & Einstellungen
            const [onboardingCompleted, setOnboardingCompleted] = useState(() => {
                return localStorage.getItem('foodly_onboarded') === 'true';
            });
            const [userProfile, setUserProfile] = useState(() => {
                const saved = localStorage.getItem('foodly_profile');
                return saved ? JSON.parse(saved) : {
                    goal: 'Muskelaufbau & High Protein',
                    diet: 'Allesesser',
                    allergies: [],
                    dislikes: '',
                    budget: 'Mittel',
                    maxTime: '20 Min',
                    supermarket: 'Aldi / Lidl'
                };
            });

            // Navigation & Ansichten
            const [activeTab, setActiveTab] = useState('home');
            const [recipes, setRecipes] = useState(() => {
                const saved = localStorage.getItem('foodly_custom_recipes');
                return saved ? JSON.parse(saved) : INITIAL_RECIPES;
            });
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Alle');
            const [selectedTag, setSelectedTag] = useState('Alle');
            const [favorites, setFavorites] = useState(() => {
                const saved = localStorage.getItem('foodly_favorites');
                return saved ? JSON.parse(saved) : [1, 4];
            });
            const [recentRecipes, setRecentRecipes] = useState([1, 2, 4]);

            // KI-Chat Zustand
            const [chatMessages, setChatMessages] = useState([
                { role: 'assistant', text: 'Hi! Ich bin dein persönlicher FOODLY KI-Kochassistent. Wie kann ich dir heute bei deiner Ernährung oder beim Kochen helfen?' }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('foodly_gemini_key') || '');
            const [isAiLoading, setIsAiLoading] = useState(false);

            // Planer & Einkaufsliste
            const [mealPlan, setMealPlan] = useState(() => {
                const saved = localStorage.getItem('foodly_mealplan');
                return saved ? JSON.parse(saved) : {
                    Montag: { frühstück: 1, mittag: 4, abend: 6 },
                    Dienstag: { frühstück: 2, mittag: 5, abend: 6 }
                };
            });

            // Dark Mode
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('foodly_dark') === 'true');

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('foodly_dark', 'true');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('foodly_dark', 'false');
                }
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('foodly_favorites', JSON.stringify(favorites));
                localStorage.setItem('foodly_custom_recipes', JSON.stringify(recipes));
                localStorage.setItem('foodly_mealplan', JSON.stringify(mealPlan));
                localStorage.setItem('foodly_profile', JSON.stringify(userProfile));
                localStorage.setItem('foodly_onboarded', onboardingCompleted ? 'true' : 'false');
            }, [favorites, recipes, mealPlan, userProfile, onboardingCompleted]);

            // Icons initialisieren
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // --- ONBOARDING MODAL ---
            if (!onboardingCompleted) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-orange-50 to-orange-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 border border-orange-100">
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-primary text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-black mb-4 shadow-lg shadow-orange-500/30">F</div>
                                <h1 className="text-3xl font-extrabold text-gray-900">Willkommen bei FOODLY</h1>
                                <p className="text-gray-500 mt-2">Lass uns dein Profil einrichten, damit die App perfekt auf deine Wünsche und Ziele abgestimmt ist.</p>
                            </div>

                            <div className="space-y-6">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Dein Ernährungsziel</label>
                                    <select 
                                        value={userProfile.goal} 
                                        onChange={(e) => setUserProfile({...userProfile, goal: e.target.value})}
                                        className="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50 font-medium"
                                    >
                                        <option>Muskelaufbau & High Protein</option>
                                        <option>Kalorienbewusst abnehmen</option>
                                        <option>Gesunde Ernährung für Schule & Alltag</option>
                                        <option>Günstig & Schnell kochen</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Ernährungsform</label>
                                    <select 
                                        value={userProfile.diet} 
                                        onChange={(e) => setUserProfile({...userProfile, diet: e.target.value})}
                                        className="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50 font-medium"
                                    >
                                        <option>Allesesser</option>
                                        <option>Vegetarisch</option>
                                        <option>Vegan</option>
                                        <option>High Protein</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">Bevorzugter Supermarkt für Preise & Einkaufsliste</label>
                                    <select 
                                        value={userProfile.supermarket} 
                                        onChange={(e) => setUserProfile({...userProfile, supermarket: e.target.value})}
                                        className="w-full p-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary bg-gray-50 font-medium"
                                    >
                                        <option>Aldi / Lidl</option>
                                        <option>Kaufland / Rewe</option>
                                        <option>Edeka</option>
                                        <option>Penny / Netto</option>
                                    </select>
                                </div>

                                <button 
                                    onClick={() => setOnboardingCompleted(true)}
                                    className="w-full py-4 bg-primary text-white rounded-2xl font-extrabold text-lg shadow-xl shadow-orange-500/30 hover:bg-orange-600 transition-all transform hover:scale-[1.01]"
                                >
                                    FOODLY starten 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- FILTER LOGIK ---
            const filteredRecipes = recipes.filter(r => {
                const matchesSearch = r.name.toLowerCase().includes(searchQuery.toLowerCase()) || r.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
                const matchesCat = selectedCategory === 'Alle' || r.category === selectedCategory;
                const matchesTag = selectedTag === 'Alle' || r.tags.includes(selectedTag);
                return matchesSearch && matchesCat && matchesTag;
            });

            // --- KI-ASSISTENT LOGIK ---
            const handleSendMessage = async () => {
                if (!chatInput.trim()) return;
                const userMsg = chatInput;
                setChatInput('');
                const newMessages = [...chatMessages, { role: 'user', text: userMsg }];
                setChatMessages(newMessages);
                setIsAiLoading(true);

                if (apiKey) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Du bist der professionelle Koch- und Fitnessassistent der App FOODLY. Antworte hilfreich, freundlich und auf Deutsch. Nutzerprofil: Ziel=${userProfile.goal}, Ernährungsform=${userProfile.diet}. Frage: ${userMsg}` }] }]
                            })
                        });
                        const data = await response.json();
                        const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Entschuldigung, das habe ich nicht ganz verstanden.";
                        setChatMessages([...newMessages, { role: 'assistant', text: aiReply }]);
                    } catch (err) {
                        setChatMessages([...newMessages, { role: 'assistant', text: "Fehler bei der Verbindung zur Gemini API. Bitte überprüfe deinen API-Schlüssel im Profil." }]);
                    }
                } else {
                    // Intelligenter Offline-Modus / Demo-Modus
                    setTimeout(() => {
                        let reply = "Das klingt lecker! Ich habe das Rezept für dich analysiert. Es passt hervorragend zu deinem Ziel (" + userProfile.goal + "). Mit Skyr, Haferflocken und frischem Obst hast du eine ideale Eiweißquelle.";
                        const lower = userMsg.toLowerCase();
                        if (lower.includes('günstig') || lower.includes('5 euro')) {

                            { id: 'aicoach', label: 'KI-Koch', icon: 'sparkles' },
                            { id: 'cookbook', label: 'Kochbuch', icon: 'book-open' },
                            { id: 'planner', label: 'Planer', icon: 'calendar' }
                        ].map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center space-y-1 transition-all ${activeTab === tab.id ? 'text-primary scale-105' : 'text-gray-400 hover:text-gray-600'}`}
                            >
                                <i data-lucide={tab.icon} className="w-6 h-6"></i>
                                <span className="text-[10px] font-bold">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.render(<FoodlyApp />, document.getElementById('root'));
    </script>
</body>
</html>
